name: release-windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write  # needed for gh release upload later

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.3'
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: List build output
        run: dir build\windows\x64\runner\Release
        shell: cmd

      - name: Upload raw build artifact (smoke test)
        uses: actions/upload-artifact@v4
        with:
          name: papersuitcase-windows-raw-build
          path: build/windows/x64/runner/Release/
          retention-days: 14
