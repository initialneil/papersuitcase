name: release-windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write  # needed for gh release upload later

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.3'
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: List build output
        run: dir build\windows\x64\runner\Release
        shell: cmd

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          # choco updates the machine PATH, but the current process and
          # subsequent steps won't pick it up unless we append to GITHUB_PATH.
          $nsisDir = "C:\Program Files (x86)\NSIS"
          if (-not (Test-Path "$nsisDir\makensis.exe")) {
            $alt = "C:\Program Files\NSIS"
            if (Test-Path "$alt\makensis.exe") { $nsisDir = $alt }
          }
          echo "Using NSIS at: $nsisDir"
          echo "$nsisDir" >> $env:GITHUB_PATH

      - name: Read version from pubspec.yaml
        id: version
        shell: pwsh
        run: |
          $line = Get-Content pubspec.yaml | Where-Object { $_ -match '^version:' } | Select-Object -First 1
          $v = ($line -replace '^version:\s*', '') -replace '\+.*$', ''
          echo "version=$v" >> $env:GITHUB_OUTPUT
          echo "Read version: $v"

      - name: Build NSIS installer
        shell: pwsh
        run: makensis "/DVERSION=${{ steps.version.outputs.version }}" installer\papersuitcase.nsi

      - name: Show installer file
        shell: pwsh
        run: Get-ChildItem PaperSuitcase-Windows-v*.exe

      - name: Upload installer artifact (manual-trigger smoke test)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: papersuitcase-windows-installer
          path: PaperSuitcase-Windows-v*.exe
          retention-days: 14

      - name: Upload installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $file = Get-ChildItem -Filter "PaperSuitcase-Windows-*.exe" | Select-Object -First 1
          if (-not $file) { throw "No installer .exe found to upload" }
          Write-Host "Uploading $($file.Name) ($([math]::Round($file.Length / 1MB, 1)) MB) to release $tag"
          gh release upload $tag $file.FullName --clobber
